<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Planner</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="current-month-year" id="currentMonthYear"></div>
            <div class="header-actions">
                <button class="icon-btn" id="userBtn" aria-label="User">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                </button>
                <button class="icon-btn" id="menuBtn" aria-label="Menu">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
                <button class="icon-btn" id="prevWeekBtn" aria-label="Previous week">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="15 18 9 12 15 6"></polyline>
                    </svg>
                </button>
                <button class="icon-btn" id="nextWeekBtn" aria-label="Next week">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Week view -->
        <div class="week-container" id="weekContainer">
            <!-- Days will be generated by JavaScript -->
        </div>

        <!-- Someday section -->
        <div class="someday-section">
            <div class="someday-header">Someday</div>
            <div class="day-tasks" id="somedayTasks" data-day="someday"></div>
        </div>
    </div>

    <!-- Color picker modal -->
    <div class="color-picker-modal" id="colorPickerModal">
        <div class="color-picker-content">
            <div class="color-options">
                <button class="color-option" data-color="default" style="background-color: #fef3c7"></button>
                <button class="color-option" data-color="green" style="background-color: #6ee7b7"></button>
                <button class="color-option" data-color="blue" style="background-color: #93c5fd"></button>
                <button class="color-option" data-color="purple" style="background-color: #c4b5fd"></button>
                <button class="color-option" data-color="pink" style="background-color: #f9a8d4"></button>
                <button class="color-option" data-color="red" style="background-color: #fca5a5"></button>
                <button class="color-option" data-color="orange" style="background-color: #fdba74"></button>
                <button class="color-option" data-color="gray" style="background-color: #d1d5db"></button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
